<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture — legacy color attributes (Hacker News style)</title>
    <style>
      body {
        margin: 0;
        font: 10pt Verdana, Geneva, sans-serif;
      }
      .subtext {
        font-size: 7pt;
        color: #828282;
      }
      a:link {
        color: #000000;
        text-decoration: none;
      }
    </style>
  </head>
  <body text="#222222">
    <table border="0" cellpadding="0" cellspacing="0" width="85%" bgcolor="#f6f6ef" align="center">
      <tr>
        <td bgcolor="#ff6600"><b><font color="#000000">Legacy News</font></b></td>
      </tr>
      <tr>
        <td>
          <table border="0" cellpadding="4" cellspacing="0">
            <tr><td><a href="#">A story title rendered by table layout</a></td></tr>
            <tr><td class="subtext">123 points by someone 2 hours ago | 45 comments</td></tr>
            <tr><td><a href="#">Another story using presentational attributes</a></td></tr>
            <tr><td class="subtext">87 points by someone else 3 hours ago | 12 comments</td></tr>
            <tr><td><font color="#828282">Grey text from a font element</font></td></tr>
          </table>
        </td>
      </tr>
      <tr>
        <td bgcolor="f6f6ef">Body text inheriting the body text attribute, on a hash-less bgcolor.</td>
      </tr>
    </table>
  </body>
</html>
