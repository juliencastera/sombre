<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture — accents and icons</title>
    <link rel="stylesheet" href="common.css" />
    <!-- Colored bars and buttons whose color is the content (Fragrantica accords), and SVG icons drawn with fill="currentColor" (GitHub octicons). -->
    <style>
      .accords {
        width: 320px;
      }
      .accords div {
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        padding: 4px 0;
      }
      .button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        font-size: 14px;
        border: 1px solid #d1d9e0;
        border-radius: 6px;
        background: #f6f8fa;
        color: #25292e;
      }
      .button.primary {
        background: #1f883d;
        border-color: #1f883d;
        color: #ffffff;
        font-weight: 500;
      }
      .heart {
        color: #bf3989;
      }
      .folder {
        color: #54aeff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="accords">
        <div class="accord" style="background: rgb(204, 51, 0); width: 100%">spicy</div>
        <div class="accord" style="background: rgb(255, 105, 180); width: 80%">rose</div>
      </div>
      <p>
        <button class="button"><svg class="heart" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="7" /></svg>Sponsor</button>
        <button class="button primary"><svg class="code-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="12" height="12" /></svg><span class="label">Code</span></button>
      </p>
      <p><svg class="folder" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="14" height="10" /></svg> docs</p>
      <!-- A logo exported with its own stylesheet, as on lpo.fr. -->
      <svg class="logo-art" width="60" height="30" viewBox="0 0 60 30">
        <style>
          .st1 { fill: #0087cd; }
          .st3 { fill: #191919; }
        </style>
        <rect class="st1" width="30" height="30" />
        <rect class="st3" x="34" y="10" width="26" height="10" />
      </svg>
      <!-- The same with its own backdrop: a white bird with black wings on a blue badge. -->
      <svg class="logo-badge" width="30" height="30" viewBox="0 0 30 30">
        <style>
          .badge-blue { fill: #0087cd; }
          .badge-white { fill: #ffffff; }
          .badge-ink { fill: #191919; }
        </style>
        <rect class="badge-blue" width="30" height="30" />
        <rect class="badge-white" x="5" y="5" width="20" height="20" />
        <rect class="badge-ink" x="10" y="10" width="10" height="10" />
      </svg>
      <!-- The same logo with inline styles, as in lpo.fr's footer. -->
      <svg class="inline-badge" width="30" height="30" viewBox="0 0 30 30">
        <path style="fill: none" d="M0 0h30v30H0z" />
        <path style="fill: #0087cd" d="M0 0h30v30H0z" />
        <path style="fill: #ffffff" d="M5 5h20v20H5z" />
        <path class="ink" style="fill: #191919" d="M10 10h10v10H10z" />
      </svg>
      <!-- A mark and a black wordmark on a transparent background: the ink must turn light. -->
      <svg class="inline-mark" width="60" height="30" viewBox="0 0 60 30">
        <path class="brand" style="fill: #0087cd" d="M0 0h30v30H0z" />
        <path class="ink" style="fill: #191919" d="M34 10h26v10H34z" />
      </svg>
      <!-- A chart on a white background, drawn with attributes: still darkened. -->
      <svg class="chart" width="60" height="30" viewBox="0 0 60 30">
        <rect class="plot" fill="#ffffff" width="60" height="30" />
        <rect fill="#0087cd" x="5" y="10" width="10" height="20" />
        <rect fill="#ffffff" x="20" y="5" width="2" height="2" />
      </svg>
    </main>
  </body>
</html>
