<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture — transparent overlay frame over a video</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .player {
        position: relative;
        width: 640px;
        height: 360px;
      }
      .video {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #1e88e5, #43a047);
      }
      .player iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header class="site"><span class="logo">Stream</span></header>
    <main>
      <div class="player">
        <div class="video"></div>
        <iframe src="https://cdn.sombre-assets.dev/overlay-frame.html" title="overlay"></iframe>
      </div>
    </main>
  </body>
</html>
