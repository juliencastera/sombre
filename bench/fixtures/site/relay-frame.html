<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Relay frame</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe src="overlay-frame.html" title="extension"></iframe>
    <script>
      // Like Twitch's extension supervisor: forwards messages between the page and the frame it hosts.
      const child = document.querySelector('iframe');
      addEventListener('message', (event) => {
        if (event.source === parent) child.contentWindow.postMessage(event.data, '*');
        else if (event.source === child.contentWindow) parent.postMessage(event.data, '*');
      });
    </script>
  </body>
</html>
