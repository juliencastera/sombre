<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture — CSS-in-JS (insertRule, constructed sheets)</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <header class="site"><span class="logo">CSS-in-JS</span></header>
    <main id="root"></main>
    <script>
      // styled-components / emotion in production mode: rules go through insertRule,
      // so the <style> element has no text content and MutationObserver sees nothing.
      const tag = document.createElement('style');
      tag.setAttribute('data-emotion', 'css');
      document.head.appendChild(tag);
      const sheet = tag.sheet;
      let counter = 0;
      function css(body) {
        const name = `css-${(++counter).toString(36)}`;
        sheet.insertRule(`.${name} { ${body} }`, sheet.cssRules.length);
        return name;
      }

      const panel = css('background: #ffffff; color: #1f2937; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 12px;');
      const title = css('color: #111827; font-size: 20px; font-weight: 600; margin: 0 0 4px;');
      const subtitle = css('color: #6b7280; margin: 0;');
      const chip = css('display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 999px; background: #dcfce7; color: #166534;');

      // A constructed stylesheet adopted by the document (Lit, some design systems).
      const adopted = new CSSStyleSheet();
      adopted.replaceSync('.adopted-panel { background: #fdf2f8; color: #831843; padding: 16px; border-radius: 8px; }');
      document.adoptedStyleSheets = [...document.adoptedStyleSheets, adopted];

      const root = document.getElementById('root');
      root.innerHTML = `
        <div class="${panel}"><h2 class="${title}">Runtime-generated class names</h2><p class="${subtitle}">Rules inserted with CSSStyleSheet.insertRule</p><span class="${chip}">Active</span></div>
        <div class="adopted-panel">Styled by an adopted constructed stylesheet</div>`;

      // Late insertion, like a component mounting after a route change.
      setTimeout(() => {
        const late = css('background: #fffbeb; color: #78350f; padding: 12px; border-radius: 8px; margin-top: 12px;');
        root.insertAdjacentHTML('beforeend', `<div class="${late}">Component mounted later with a fresh insertRule</div>`);
      }, 700);
    </script>
  </body>
</html>
